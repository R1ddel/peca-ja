<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Peça Já — roteiro por dia</title>
  <style>
    :root {
      --green: #00a86b;
      --green-dark: #007a4d;
      --ink: #1e3a2f;
      --gold: #ffb800;
      --bg: #eef5f0;
      --card: #ffffff;
      --muted: #5c6f64;
      --line: #d5e6dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--ink);
      color: #fff;
      padding: 14px 16px 10px;
      box-shadow: 0 6px 20px rgba(15, 33, 25, 0.18);
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 4px 0 10px;
      font-size: 12px;
      color: #b7d4c6;
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none;
      border: 0;
      background: rgba(255,255,255,0.1);
      color: #e7fff4;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--gold);
      color: var(--ink);
    }
    .tab.done-day {
      outline: 2px solid var(--green);
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .page-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .page h2 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .page .meta {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress {
      height: 8px;
      background: #d7e8de;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.2s ease;
    }
    .progress-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: -8px 0 14px;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 6px;
      margin-bottom: 12px;
    }
    .section h3 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--green-dark);
    }
    label.task {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 4px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }
    label.task:first-of-type { border-top: 0; }
    label.task input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      flex: none;
    }
    label.task.done span {
      text-decoration: line-through;
      color: #7a8f84;
      font-weight: 500;
    }
    .goal {
      background: #e8f8f0;
      border: 1px solid #b8e6d0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }
    .goal b {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green-dark);
      margin-bottom: 4px;
    }
    .warn {
      background: #fff8e6;
      border-color: #ffe08a;
    }
    .warn b { color: #8a6a00; }
    .nav-day {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .nav-day button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .nav-day .prev {
      background: #d7e3dc;
      color: var(--ink);
    }
    .nav-day .next {
      background: var(--green);
      color: #fff;
    }
    .nav-day button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    footer {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 14px 28px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    footer button {
      border: 0;
      background: transparent;
      color: #a33;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Roteiro de lançamento</h1>
    <p>Segunda 03/11 · almoço · uma página por dia</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>

  <main id="pages"></main>

  <footer>
    Progresso salvo neste celular/navegador.
    <button type="button" id="resetAll">Zerar todas as marcas</button>
  </footer>

  <script>
    const STORAGE_KEY = "pecaja_roteiro_lancamento_v1";

    const days = [
      {
        id: "terca",
        tab: "Terça",
        page: 1,
        title: "Terça-feira",
        date: "27/10 · D−6",
        sections: [
          {
            name: "Na rua",
            tasks: [
              "Fechar lojas prontas pra vender (não só interessada)",
              "Meta go-live: 8–10 lojas com cardápio + foto + horário + quem atende",
              "Cadastrar entregadores e combinar quem fica online na segunda",
              "Anotar WhatsApp de cada loja e moto (plantão)",
            ],
          },
          {
            name: "À noite / escritório",
            tasks: [
              "Status da conta PJ (o que falta e prazo real)",
              "Combinar com marketing: go-live segunda 03/11 ~11h30",
              "Combinar com blogueiras: gravar já, publicar na segunda (domingo só teaser)",
              "Panfleto: preencher WhatsApp final e imprimir lote 1",
            ],
          },
        ],
        goal: "Lista escrita de lojas ✅ pronta vs ⏳ falta cardápio.",
      },
      {
        id: "quarta",
        tab: "Quarta",
        page: 2,
        title: "Quarta-feira",
        date: "28/10 · D−5",
        sections: [
          {
            name: "Tarefas do dia",
            tasks: [
              "Completar cardápio das lojas ⏳ (foto + preço + horário)",
              "Confirmar chave Pix / dados de recebimento de cada loja",
              "Definir 2º e 3º entregador de backup (nome + WhatsApp)",
              "Se PJ/MP liberado: 1 pedido Pix valor baixo ponta a ponta",
              "Marketing: criativos com lojas reais da cidade",
              "Definir 1 loja âncora (rápida, perto do centro)",
            ],
          },
        ],
        goal: "Pelo menos 5 lojas com cardápio publicado no app.",
      },
      {
        id: "quinta",
        tab: "Quinta",
        page: 3,
        title: "Quinta-feira",
        date: "29/10 · D−4",
        sections: [
          {
            name: "Tarefas do dia",
            tasks: [
              "Chegar em 8+ lojas prontas",
              "Testar login loja + painel + notificação de pedido novo",
              "Testar entregador: online → recebe → rota",
              "Canal de suporte: número único e quem responde 11h–22h",
              "Roteiro rápido: Pix não caiu / loja não viu / sem moto",
              "Blogueiras: CTA único (baixe Peça Já · peça na loja)",
              "Panfletos impressos; distribuição seletiva (não queimar tudo)",
            ],
          },
        ],
        goal: "1 pedido de ensaio com pessoa real concluído — ou bloqueio claro = PJ.",
      },
      {
        id: "sexta",
        tab: "Sexta",
        page: 4,
        title: "Sexta-feira",
        date: "30/10 · D−3",
        sections: [
          {
            name: "Tarefas do dia",
            tasks: [
              "Soft launch interno: 3–5 pedidos reais (amigos/família)",
              "Conferir: loja abriu no horário? moto pegou? Pix ok?",
              "Ajustar o que quebrou (cardápio, horário, GPS, aviso)",
              "Lista oficial das lojas do lançamento (story / tráfego)",
              "Marketing: campanha pausada, agendada pra segunda 11h30",
              "Confirmar plantão segunda: lojas + 2 motos + você no WhatsApp",
            ],
          },
        ],
        goal: "Pelo menos 3 pedidos entregues sem drama.",
        warn: "Se PJ, lojas ou moto estiverem vermelhos hoje, empurre o oficial para a próxima segunda.",
      },
      {
        id: "sabado",
        tab: "Sábado",
        page: 5,
        title: "Sábado",
        date: "01/11 · D−2",
        sections: [
          {
            name: "Tarefas do dia",
            tasks: [
              "Manhã: lojas que abrem no sábado → 2 pedidos reais",
              "Revisar panfleto / QR / link da store (sem placeholder)",
              "Entregadores: escala domingo (leve) e segunda (oficial)",
              "Imprimir checklist do plantão",
              "Não ligar tráfego pago ainda",
            ],
          },
        ],
        goal: "Oferta estável; zero surpresa técnica nova.",
      },
      {
        id: "domingo",
        tab: "Domingo",
        page: 6,
        title: "Domingo",
        date: "02/11 · D−1",
        sections: [
          {
            name: "Fazer",
            tasks: [
              "2–4 pedidos controlados (círculo próximo)",
              "Confirmar quais lojas abrem segunda no almoço",
              "Blogueiras: teaser opcional (“amanhã tem Peça Já”)",
              "Descansar o suficiente pra segunda estar afiado",
            ],
          },
          {
            name: "Não fazer",
            tasks: [
              "Não disparar tráfego pago forte",
              "Não prometer “já tem 50 lojas” se não tiver",
              "Não sumir do WhatsApp (volume baixo, mas presente)",
            ],
          },
        ],
        goal: "Segunda amanhece com lojas confirmadas + 2 motos + Pix ok.",
      },
      {
        id: "segunda",
        tab: "Segunda",
        page: 7,
        title: "Segunda-feira — Dia D",
        date: "03/11 · lançamento",
        sections: [
          {
            name: "Antes das 11h",
            tasks: [
              "API / app / Pix: health ok",
              "Lojas âncora abertas no app",
              "2 entregadores online",
              "Você (ou backup) no WhatsApp suporte",
              "1 pedido de fumaça (valor baixo) ~11h",
            ],
          },
          {
            name: "11h30 — go live",
            tasks: [
              "Marketing liga tráfego pago (cidade piloto)",
              "Blogueiras publicam CTA de baixar + pedir",
              "Stories marcando lojas apoiadoras",
              "Panfleto já na rua",
            ],
          },
          {
            name: "Almoço e noite",
            tasks: [
              "Monitorar pedidos, loja sem responder, moto offline",
              "Se faltar moto: pausar anúncio 30–60 min",
              "Anotar 3 problemas do dia (corrigir terça)",
            ],
          },
        ],
        goal: "Sucesso = pedidos concluídos, zero loja fantasma, suporte &lt; 10 min no pico.",
      },
    ];

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let current = 0;

    const tabsEl = document.getElementById("tabs");
    const pagesEl = document.getElementById("pages");

    function taskKey(dayId, sectionIdx, taskIdx) {
      return `${dayId}:${sectionIdx}:${taskIdx}`;
    }

    function dayStats(day) {
      let total = 0;
      let done = 0;
      day.sections.forEach((sec, sIdx) => {
        sec.tasks.forEach((_, tIdx) => {
          total += 1;
          if (state[taskKey(day.id, sIdx, tIdx)]) done += 1;
        });
      });
      return { total, done };
    }

    function render() {
      tabsEl.innerHTML = "";
      pagesEl.innerHTML = "";

      days.forEach((day, idx) => {
        const { total, done } = dayStats(day);
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab" + (idx === current ? " active" : "") + (done === total && total > 0 ? " done-day" : "");
        tab.textContent = `${day.page}. ${day.tab}`;
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", idx === current ? "true" : "false");
        tab.addEventListener("click", () => {
          current = idx;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        tabsEl.appendChild(tab);
      });

      days.forEach((day, idx) => {
        const { total, done } = dayStats(day);
        const pct = total ? Math.round((done / total) * 100) : 0;
        const page = document.createElement("section");
        page.className = "page" + (idx === current ? " active" : "");
        page.setAttribute("role", "tabpanel");

        let html = `
          <div class="page-badge">Página ${day.page} de 7</div>
          <h2>${day.title}</h2>
          <p class="meta">${day.date}</p>
          <div class="progress"><span style="width:${pct}%"></span></div>
          <p class="progress-label">${done} de ${total} concluídas · ${pct}%</p>
        `;

        day.sections.forEach((sec, sIdx) => {
          html += `<div class="section"><h3>${sec.name}</h3>`;
          sec.tasks.forEach((task, tIdx) => {
            const key = taskKey(day.id, sIdx, tIdx);
            const checked = !!state[key];
            html += `
              <label class="task${checked ? " done" : ""}">
                <input type="checkbox" data-key="${key}" ${checked ? "checked" : ""} />
                <span>${task}</span>
              </label>
            `;
          });
          html += `</div>`;
        });

        html += `<div class="goal"><b>Critério do dia</b>${day.goal}</div>`;
        if (day.warn) {
          html += `<div class="goal warn" style="margin-top:10px"><b>Atenção</b>${day.warn}</div>`;
        }

        html += `
          <div class="nav-day">
            <button type="button" class="prev" data-nav="prev" ${idx === 0 ? "disabled" : ""}>← Dia anterior</button>
            <button type="button" class="next" data-nav="next" ${idx === days.length - 1 ? "disabled" : ""}>Próximo dia →</button>
          </div>
        `;

        page.innerHTML = html;
        pagesEl.appendChild(page);
      });

      pagesEl.querySelectorAll('input[type="checkbox"]').forEach((input) => {
        input.addEventListener("change", () => {
          const key = input.getAttribute("data-key");
          if (input.checked) state[key] = true;
          else delete state[key];
          saveState(state);
          render();
        });
      });

      pagesEl.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.getAttribute("data-nav") === "prev" && current > 0) current -= 1;
          if (btn.getAttribute("data-nav") === "next" && current < days.length - 1) current += 1;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    document.getElementById("resetAll").addEventListener("click", () => {
      if (confirm("Zerar todas as tarefas marcadas?")) {
        state = {};
        saveState(state);
        render();
      }
    });

    // Abre no dia de hoje se bater com a semana do lançamento
    const today = new Date();
    const map = {
      27: 0, // terça 27
      28: 1,
      29: 2,
      30: 3,
      1: 4,  // sábado nov
      2: 5,
      3: 6,
    };
    if (map[today.getDate()] !== undefined) current = map[today.getDate()];

    render();
  </script>
</body>
</html>
